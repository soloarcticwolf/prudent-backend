[project]
name = "prudent-backend"
version = "0.1.0"
description = "Prudent climate intelligence backend — historical heatwave analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pymongo>=4.8",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "anyio>=4.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
